<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 基础信息管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="env.js"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">基础信息管理系统</h1>
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">用户名</label>
        <input type="text" id="username" name="username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
        <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-gray-700">记住我</label>
        </div>
      </div>
      <div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          登录
        </button>
      </div>
    </form>
    <div id="error-message" class="mt-4 text-sm text-red-600 hidden"></div>
    <div class="mt-6 text-center text-sm text-gray-600">
      <p>测试账号：</p>
      <p>业务员: username: sales, password: sales123</p>
      <p>采购员: username: purchase, password: purchase123</p>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? '' 
      : (window.ENV?.API_URL || '');
      
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');

      try {
        const response = await fetch(API_BASE_URL + '/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (data.success) {
          // 存储用户信息到本地存储
          localStorage.setItem('user', JSON.stringify(data.user));
          // 跳转到主页面
          window.location.href = 'index.html';
        } else {
          errorMessage.textContent = data.error || '登录失败';
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        errorMessage.textContent = '网络错误，请检查后端服务是否启动';
        errorMessage.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
