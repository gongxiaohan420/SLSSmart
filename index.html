<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <!-- 顶部导航 -->
  <nav class="bg-gray-800 text-white px-6 py-4">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold">采购管理系统</h1>
      <div class="flex items-center space-x-4">
        <span id="user-info" class="text-sm">用户：</span>
        <button onclick="logout()" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded">退出登录</button>
      </div>
    </div>
  </nav>

  <!-- 侧边栏 -->
  <div class="flex">
    <aside class="w-64 bg-gray-200 min-h-screen p-4">
      <div class="space-y-2">
        <button onclick="loadPurchaseOrderList()" class="w-full text-left px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">采购单管理</button>
        <button onclick="loadPIList()" class="w-full text-left px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">销售报价单管理</button>
        <button onclick="loadSupplierList()" class="w-full text-left px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">供应商管理</button>
        <button onclick="loadProductList()" class="w-full text-left px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">产品管理</button>
        <button onclick="loadCustomerList()" class="w-full text-left px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">客户管理</button>
        <button onclick="loadInventoryList()" class="w-full text-left px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">库存管理</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 p-6">
      <div class="bg-white rounded-lg shadow">
        <div class="flex justify-between items-center px-6 py-4 border-b">
          <h2 id="table-title" class="text-lg font-semibold">采购管理系统</h2>
          <div id="action-buttons"></div>
        </div>
        <div id="table-container" class="p-6">
          加载中...
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentTable = 'purchaseOrders';
    let expandedPiGroups = new Set();

    // 检查登录状态
    function checkLogin() {
      const user = localStorage.getItem('user');
      if (!user) {
        window.location.href = 'login.html';
        return null;
      }
      return JSON.parse(user);
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // 更新用户信息显示
    function updateUserInfo() {
      const user = checkLogin();
      if (user) {
        document.getElementById('user-info').textContent = `用户：${user.username} (${user.role})`;
      }
    }
    
    // 更新菜单选中状态
    function updateMenuActive(activeMenu) {
      const menuButtons = document.querySelectorAll('aside button');
      menuButtons.forEach(btn => {
        if (btn.textContent.trim() === activeMenu) {
          btn.classList.remove('bg-gray-500', 'hover:bg-gray-600');
          btn.classList.add('bg-blue-500', 'hover:bg-blue-600');
        } else {
          btn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
          btn.classList.add('bg-gray-500', 'hover:bg-gray-600');
        }
      });
    }

    // 生成采购单编号
    function generatePurchaseOrderNumber() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const random = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
      return `CG${year}${month}${day}${random}`;
    }

    // 加载采购单列表
    async function loadPurchaseOrderList() {
      const user = checkLogin();
      if (!user) return;
      
      updateMenuActive('采购单管理');

      try {
        const response = await fetch('/api/purchase-orders', {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderPurchaseOrderList(data);
        } else {
          alert('获取采购单列表失败：' + data.error);
        }
      } catch (error) {
        alert('加载采购单失败：' + error.message);
      }
    }

    // 加载供应商列表
    async function loadSupplierList() {
      const user = checkLogin();
      if (!user) return;
      
      updateMenuActive('供应商管理');

      try {
        const response = await fetch('/api/suppliers', {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderSupplierList(data);
        } else {
          alert('获取供应商列表失败：' + data.error);
        }
      } catch (error) {
        alert('加载供应商失败：' + error.message);
      }
    }

    // 渲染供应商列表
    function renderSupplierList(suppliers) {
      const tableContainer = document.getElementById('table-container');
      let searchHTML = '<div class="mb-4 flex items-center"><input type="text" id="supplier-search" placeholder="搜索..." class="px-3 py-2 border border-gray-300 rounded-md mr-2 w-64"><button onclick="searchSuppliers()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">搜索</button><button onclick="clearSupplierSearch()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded ml-2">清空</button></div>';
      
      let html = searchHTML + '<table class="min-w-full border border-gray-200"><thead class="bg-gray-50"><tr><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">供应商ID</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">供应商名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">公司类型</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">主营产品</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">联系人</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">联系方式</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">操作</th></tr></thead><tbody class="divide-y divide-gray-200">';
      
      for (const item of suppliers) {
        html += '<tr><td class="px-6 py-3 text-sm text-gray-900">' + item.id + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.name + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.companyType + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.mainProducts + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.contact + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.contactInfo + '</td><td class="px-6 py-3 text-sm"><button onclick="editSupplier(\'' + item.id + '\')" class="text-blue-600 hover:text-blue-900 mr-2 text-xs">编辑</button><button onclick="showSupplierAttachments(\'' + item.id + '\')" class="text-purple-600 hover:text-purple-900 mr-2 text-xs">附件</button><button onclick="deleteSupplier(\'' + item.id + '\')" class="text-red-600 hover:text-red-900 text-xs">删除</button></td></tr>';
      }
      
      html += '</tbody></table><div class="mt-4 flex justify-between items-center"><div class="text-sm text-gray-500">共 ' + suppliers.length + ' 条记录</div></div>';
      
      tableContainer.innerHTML = html;
      document.getElementById('table-title').textContent = '供应商管理';
      document.getElementById('action-buttons').innerHTML = '<button onclick="createSupplier()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">新增供应商</button><button onclick="showImportModal(\'suppliers\')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">导入供应商</button>';
      currentTable = 'suppliers';
    }

    // 加载产品列表
    async function loadProductList() {
      const user = checkLogin();
      if (!user) return;
      
      updateMenuActive('产品管理');

      try {
        const response = await fetch('/api/products', {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderProductList(data);
        } else {
          alert('获取产品列表失败：' + data.error);
        }
      } catch (error) {
        alert('加载产品失败：' + error.message);
      }
    }

    // 渲染产品列表
    function renderProductList(products) {
      const tableContainer = document.getElementById('table-container');
      let searchHTML = '<div class="mb-4 flex items-center"><input type="text" id="product-search" placeholder="搜索..." class="px-3 py-2 border border-gray-300 rounded-md mr-2 w-64"><button onclick="searchProducts()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">搜索</button><button onclick="clearProductSearch()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded ml-2">清空</button></div>';
      
      let html = searchHTML + '<table class="min-w-full border border-gray-200"><thead class="bg-gray-50"><tr><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">产品ID</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">英文名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">中文名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">销售价(≤100)</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">销售价(>100)</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">供应商</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">采购价</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">采购链接</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">采购渠道</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">操作</th></tr></thead><tbody class="divide-y divide-gray-200">';
      
      for (const item of products) {
        const purchasePrice = item.purchasePrice || item.purchasePriceLess100 || 0;
        html += '<tr><td class="px-6 py-3 text-sm text-gray-900">' + item.id + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.englishName + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.chineseName + '</td><td class="px-6 py-3 text-sm text-gray-900">¥' + item.salesPriceLess100 + '</td><td class="px-6 py-3 text-sm text-gray-900">¥' + item.salesPriceMore100 + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.supplierName + '</td><td class="px-6 py-3 text-sm text-gray-900">¥' + purchasePrice + '</td><td class="px-6 py-3 text-sm text-gray-900">' + (item.purchaseLink ? '<a href="' + item.purchaseLink + '" target="_blank" class="text-blue-600 hover:text-blue-900 truncate max-w-xs inline-block">查看</a>' : '-') + '</td><td class="px-6 py-3 text-sm text-gray-900">' + (item.purchaseChannel || '-') + '</td><td class="px-6 py-3 text-sm"><button onclick="editProduct(\'' + item.id + '\')" class="text-blue-600 hover:text-blue-900 mr-2 text-xs">编辑</button><button onclick="deleteProduct(\'' + item.id + '\')" class="text-red-600 hover:text-red-900 text-xs">删除</button></td></tr>';
      }
      
      html += '</tbody></table><div class="mt-4 flex justify-between items-center"><div class="text-sm text-gray-500">共 ' + products.length + ' 条记录</div></div>';
      
      tableContainer.innerHTML = html;
      document.getElementById('table-title').textContent = '产品管理';
      document.getElementById('action-buttons').innerHTML = '<button onclick="createProduct()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">新增产品</button><button onclick="importProducts()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">导入产品</button>';
      currentTable = 'products';
    }

    // 加载客户列表
    async function loadCustomerList() {
      const user = checkLogin();
      if (!user) return;
      
      updateMenuActive('客户管理');

      try {
        const response = await fetch('/api/customers', {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderCustomerList(data);
        } else {
          alert('获取客户列表失败：' + data.error);
        }
      } catch (error) {
        alert('加载客户失败：' + error.message);
      }
    }

    // 渲染客户列表
    function renderCustomerList(customers) {
      const tableContainer = document.getElementById('table-container');
      let searchHTML = '<div class="mb-4 flex items-center"><input type="text" id="customer-search" placeholder="搜索..." class="px-3 py-2 border border-gray-300 rounded-md mr-2 w-64"><button onclick="searchCustomers()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">搜索</button><button onclick="clearCustomerSearch()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded ml-2">清空</button></div>';
      
      let html = searchHTML + '<table class="min-w-full border border-gray-200"><thead class="bg-gray-50"><tr><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">客户ID</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">公司名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">公司简称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">联系人</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">国家</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">公司规模</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">操作</th></tr></thead><tbody class="divide-y divide-gray-200">';
      
      for (const item of customers) {
        html += '<tr><td class="px-6 py-3 text-sm text-gray-900">' + item.id + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.companyName + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.companyShortName + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.contact + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.country + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.companySize + '</td><td class="px-6 py-3 text-sm"><button onclick="editCustomer(\'' + item.id + '\')" class="text-blue-600 hover:text-blue-900 mr-2 text-xs">编辑</button><button onclick="deleteCustomer(\'' + item.id + '\')" class="text-red-600 hover:text-red-900 text-xs">删除</button></td></tr>';
      }
      
      html += '</tbody></table><div class="mt-4 flex justify-between items-center"><div class="text-sm text-gray-500">共 ' + customers.length + ' 条记录</div></div>';
      
      tableContainer.innerHTML = html;
      document.getElementById('table-title').textContent = '客户管理';
      document.getElementById('action-buttons').innerHTML = '<button onclick="createCustomer()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">新增客户</button><button onclick="showImportModal(\'customers\')" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">导入客户</button>';
      currentTable = 'customers';
    }

    // 加载库存列表
    async function loadInventoryList() {
      const user = checkLogin();
      
      updateMenuActive('库存管理');
      if (!user) return;

      try {
        const response = await fetch('/api/inventory', {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderInventoryList(data);
        } else {
          alert('获取库存列表失败：' + data.error);
        }
      } catch (error) {
        alert('加载库存失败：' + error.message);
      }
    }

    // 渲染库存列表
    function renderInventoryList(inventory) {
      const tableContainer = document.getElementById('table-container');
      let searchHTML = '<div class="mb-4 flex items-center"><input type="text" id="inventory-search" placeholder="搜索..." class="px-3 py-2 border border-gray-300 rounded-md mr-2 w-64"><button onclick="searchInventory()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">搜索</button><button onclick="clearInventorySearch()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded ml-2">清空</button></div>';
      
      let html = searchHTML + '<table class="min-w-full border border-gray-200"><thead class="bg-gray-50"><tr><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">产品ID</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">英文名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">中文名称</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">库存数量</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">仓库</th><th class="px-6 py-2 text-left text-xs font-medium text-gray-500">操作</th></tr></thead><tbody class="divide-y divide-gray-200">';
      
      for (const item of inventory) {
        html += '<tr><td class="px-6 py-3 text-sm text-gray-900">' + item.productId + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.englishName + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.chineseName + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.quantity + '</td><td class="px-6 py-3 text-sm text-gray-900">' + item.warehouse + '</td><td class="px-6 py-3 text-sm"><button onclick="editInventory(\'' + item.productId + '\')" class="text-blue-600 hover:text-blue-900 mr-2 text-xs">编辑</button><button onclick="deleteInventory(\'' + item.productId + '\')" class="text-red-600 hover:text-red-900 text-xs">删除</button></td></tr>';
      }
      
      html += '</tbody></table><div class="mt-4 flex justify-between items-center"><div class="text-sm text-gray-500">共 ' + inventory.length + ' 条记录</div></div>';
      
      tableContainer.innerHTML = html;
      document.getElementById('table-title').textContent = '库存管理';
      document.getElementById('action-buttons').innerHTML = '<button onclick="createInventory()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">新增库存</button><button onclick="importInventory()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">导入库存</button>';
      currentTable = 'inventory';
    }

    // 渲染采购单列表（级联树形结构）
    function renderPurchaseOrderList(purchaseOrders) {
      const tableContainer = document.getElementById('table-container');
      
      // 分离手动新增的采购单和从PI生成的采购单
      const manualOrders = purchaseOrders.filter(order => !order.piId || order.piId === '');
      const piOrders = purchaseOrders.filter(order => order.piId && order.piId !== '');
      
      // 按PI单号分组
      const groupedByPi = piOrders.reduce((acc, order) => {
        const piId = order.piId;
        if (!acc[piId]) {
          acc[piId] = [];
        }
        acc[piId].push(order);
        return acc;
      }, {});
      
      // 将PI分组转换为数组并按创建时间倒序排列
      const sortedPiGroups = Object.entries(groupedByPi).sort((a, b) => {
        const piA = a[1][0];
        const piB = b[1][0];
        return new Date(piB.created_at) - new Date(piA.created_at);
      });
      
      let searchHTML = '<div class="mb-4 flex items-center"><input type="text" id="purchase-orders-search" placeholder="搜索..." class="px-3 py-2 border border-gray-300 rounded-md mr-2 w-64"><button onclick="searchPurchaseOrders()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">搜索</button><button onclick="clearPurchaseOrdersSearch()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded ml-2">清空</button></div>';
      
      let treeHTML = searchHTML + '<div class="space-y-2">';
      
      // 显示手动新增的采购单
      if (manualOrders.length > 0) {
        treeHTML += '<div class="bg-green-50 border border-green-200 rounded-lg overflow-hidden">';
        treeHTML += '<div class="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-green-100" onclick="togglePiGroup(\'manual\')">';
        treeHTML += '<div class="flex items-center">';
        treeHTML += '<span id="pi-icon-manual" class="mr-2 text-green-600">&#9654;</span>';
        treeHTML += '<span class="font-semibold text-green-800">手动新增采购单</span>';
        treeHTML += '<span class="ml-2 text-sm text-green-600">(' + manualOrders.length + ' 条采购单)</span>';
        treeHTML += '</div>';
        treeHTML += '<span class="text-gray-400">点击展开/收起</span>';
        treeHTML += '</div>';
        treeHTML += '<div id="pi-group-manual" class="hidden">';
        treeHTML += '<div class="bg-white border-t border-green-100">';
        treeHTML += '<table class="min-w-full">';
        treeHTML += '<thead class="bg-gray-50">';
        treeHTML += '<tr>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">采购单编号</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">供应商</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">商品数量</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">总金额</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">数据来源</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">状态</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">创建日期</th>';
        treeHTML += '<th class="px-6 py-2 text-left text-xs font-medium text-gray-500">操作</th>';
        treeHTML += '</tr>';
        treeHTML += '</thead>';
        treeHTML += '<tbody class="divide-y divide-gray-200">';
        
        manualOrders.forEach(order => {
          let actions = '';
          const itemId = order.id;
          
          switch (order.status) {
            case '已生成':

    // 搜索采购单
    async function searchPurchaseOrders() {
      const user = checkLogin();
      if (!user) return;

      const searchTerm = document.getElementById('purchase-orders-search').value.trim();
      if (!searchTerm) {
        loadPurchaseOrderList();
        return;
      }

      try {
        const response = await fetch('/api/purchase-orders?search=' + encodeURIComponent(searchTerm), {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });

        const data = await response.json();
        if (response.ok) {
          renderPurchaseOrderList(data);
        } else {
          alert('搜索失败：' + data.error);
        }
      } catch (error) {
        alert('搜索失败：' + error.message);
      }
    }

    // 切换Tab
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
      });
      document.querySelectorAll('[id^="tab-"]').forEach(tab => {
        tab.classList.remove('text-blue-600', 'border-blue-600');
        tab.classList.add('text-gray-500');
      });
      document.getElementById('content-' + tabName).classList.remove('hidden');
      document.getElementById('tab-' + tabName).classList.add('text-blue-600', 'border-blue-600');
      document.getElementById('tab-' + tabName).classList.remove('text-gray-500');

    // 删除编辑采购单产品行
    function removeEditProduct(index) {
      const rows = document.querySelectorAll('#edit-product-list > div');
      if (rows.length > 1) {
        rows[index].remove();
        // 更新索引
        document.querySelectorAll('#edit-product-list > div').forEach((row, i) => {

    // 保存编辑采购单
    async function saveEditPurchaseOrder(id) {
      const user = checkLogin();
      if (!user) return;

      const supplierId = document.getElementById('edit-supplier-select').value;
      const note = document.getElementById('edit-purchase-note').value;
      
      // 收集产品信息
      const products = [];
      const productRows = document.querySelectorAll('#edit-product-list > div');
      productRows.forEach((row, index) => {
        const productId = document.getElementById('edit-product-id-' + index).value;
        const select = document.getElementById('edit-product-select-' + index);
        const option = select.options[select.selectedIndex];
        const quantity = parseInt(document.getElementById('edit-product-quantity-' + index).value) || 0;
        const unitPrice = parseFloat(document.getElementById('edit-product-price-' + index).value) || 0;
        const purchaseLink = document.getElementById('edit-product-link-' + index).value;
        const purchaseChannel = document.getElementById('edit-product-channel-' + index).value;
        
        if (productId && quantity > 0) {
          products.push({
            productId: productId,
            chineseName: option.getAttribute('data-chinese-name'),
            englishName: option.getAttribute('data-english-name'),
            quantity: quantity,
            unitPrice: unitPrice,
            purchaseLink: purchaseLink,
            purchaseChannel: purchaseChannel
          });
        }
      });

      if (products.length === 0) {
        alert('请至少添加一个产品');
        return;
      }

      try {
        const response = await fetch('/api/purchase-orders/' + id, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          },
          body: JSON.stringify({ supplierId, note, products })
        });

        const data = await response.json();
        if (response.ok) {
          alert('采购单更新成功');
          closeModal();
          loadPurchaseOrderList();
        } else {
          alert('更新失败：' + data.error);
        }
      } catch (error) {
        alert('更新失败：' + error.message);
      }
    }

    // 选择产品时自动填充采购价格、采购链接和采购渠道
    function onPurchaseProductSelect(selectElement, index) {
      const container = document.getElementById('create-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      const priceInput = row.querySelector('.price-input');
      const quantityInput = row.querySelector('.quantity-input');
      const linkInput = row.querySelector('.link-input');
      const channelInput = row.querySelector('.channel-input');
      
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      if (selectedOption.value) {
        const purchasePriceLess100 = parseFloat(selectedOption.dataset.purchasePriceLess100) || 0;
        const purchasePriceMore100 = parseFloat(selectedOption.dataset.purchasePriceMore100) || 0;
        const quantity = parseInt(quantityInput.value) || 1;
        
        // 根据数量选择对应的采购价格
        const purchasePrice = quantity < 100 ? purchasePriceLess100 : purchasePriceMore100;
        priceInput.value = purchasePrice ? purchasePrice.toFixed(2) : '';
        
        // 填充采购链接和采购渠道
        linkInput.value = selectedOption.dataset.purchaseLink || '';
        channelInput.value = selectedOption.dataset.purchaseChannel || '';
      } else {
        priceInput.value = '';
        linkInput.value = '';
        channelInput.value = '';
      }
    }
    
    // 数量变化时更新采购价格
    function onPurchaseQuantityChange(inputElement, index) {
      const container = document.getElementById('create-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      const select = row.querySelector('.product-select');
      const priceInput = row.querySelector('.price-input');
      
      const selectedOption = select.options[select.selectedIndex];
      if (selectedOption.value) {
        const purchasePriceLess100 = parseFloat(selectedOption.dataset.purchasePriceLess100) || 0;
        const purchasePriceMore100 = parseFloat(selectedOption.dataset.purchasePriceMore100) || 0;
        const quantity = parseInt(inputElement.value) || 1;
        
        const purchasePrice = quantity < 100 ? purchasePriceLess100 : purchasePriceMore100;
        priceInput.value = purchasePrice ? purchasePrice.toFixed(2) : '';
      }
    }

    // 保存采购单
    async function savePurchaseOrder() {
      const user = checkLogin();
      if (!user) return;

      const piId = document.getElementById('create-pi-id').value;
      const supplierId = document.getElementById('create-supplier-select').value;
      const note = document.getElementById('create-purchase-note').value;

      const productRows = document.querySelectorAll('#create-product-list > div');
      const products = [];

      productRows.forEach(row => {
        const productId = row.querySelector('.product-select').value;
        const quantity = parseInt(row.querySelector('.quantity-input').value) || 0;
        const unitPrice = parseFloat(row.querySelector('.price-input').value) || 0;
        const purchaseLink = row.querySelector('.link-input').value;
        const purchaseChannel = row.querySelector('.channel-input').value;

        if (productId && quantity > 0) {
          products.push({
            productId,
            quantity,
            unitPrice,
            purchaseLink,
            purchaseChannel
          });
        }
      });

      if (products.length === 0) {

            'password': user.role === '业务员' ? 'sales123' : 'purchase123'

          body: JSON.stringify({ piId, supplierId, products, note })
        });

          closeModal();
          loadPurchaseOrderList();
        } else {
          alert('创建失败：' + data.error);
        }
      } catch (error) {
        alert('创建失败：' + error.message);
      }
    }

    function onPIProductSelect(selectElement, index) {
      const container = document.getElementById('create-pi-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      const productIdInput = row.querySelector('.pi-product-id');
      const salesPriceInput = row.querySelector('.pi-product-sales-price');
      const quantityInput = row.querySelector('.pi-product-quantity');
      
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      if (selectedOption.value) {
        productIdInput.value = selectedOption.value;
        
        const salesPriceLess100 = parseFloat(selectedOption.dataset.salesPriceLess100) || 0;
        const salesPriceMore100 = parseFloat(selectedOption.dataset.salesPriceMore100) || 0;
        const quantity = parseInt(quantityInput.value) || 1;
        
        // 根据数量选择对应的销售价
        const salesPrice = quantity < 100 ? salesPriceLess100 : salesPriceMore100;
        salesPriceInput.value = salesPrice ? salesPrice.toFixed(2) : '';
      } else {
        productIdInput.value = '';
        salesPriceInput.value = '';
      }
    }
    
    function onPIQuantityChange(inputElement, index) {
      const container = document.getElementById('create-pi-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      const select = row.querySelector('.pi-product-select');
      const salesPriceInput = row.querySelector('.pi-product-sales-price');
      
      const selectedOption = select.options[select.selectedIndex];
      if (selectedOption.value) {
        const salesPriceLess100 = parseFloat(selectedOption.dataset.salesPriceLess100) || 0;
        const salesPriceMore100 = parseFloat(selectedOption.dataset.salesPriceMore100) || 0;
        const quantity = parseInt(inputElement.value) || 1;
        
        const salesPrice = quantity < 100 ? salesPriceLess100 : salesPriceMore100;
        salesPriceInput.value = salesPrice ? salesPrice.toFixed(2) : '';
      }
    }

    async function downloadTemplate(type) {
      const user = checkLogin();
      if (!user) return;
      
      try {
        const response = await fetch('/api/templates/' + type, {
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          }
        });
        
        if (response.ok) {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const typeNames = {
            'suppliers': 'supplier_import_template.xlsx',
            'products': 'product_import_template.xlsx',
            'customers': 'customer_import_template.xlsx',
            'inventory': 'inventory_import_template.xlsx'
          };
          a.download = typeNames[type] || 'import_template.xlsx';
          a.click();
          window.URL.revokeObjectURL(url);
        } else {
          const data = await response.json();
          alert('下载模板失败：' + data.error);
        }
      } catch (error) {
        alert('下载模板失败：' + error.message);
      }
    }

    async function uploadFile(type) {
      const user = checkLogin();
      if (!user) return;
      
      const fileInput = document.getElementById('import-file');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('请选择文件');
        return;
      }
      
      try {
        const formData = new FormData();
        formData.append('file', file);
        
        const response = await fetch('/api/import/' + type, {
          method: 'POST',
          headers: {
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          },
          body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
          let message = '导入完成！\n成功：' + data.successCount + '条';
          if (data.failCount > 0) {
            message += '\n失败：' + data.failCount + '条';
            if (data.errors && data.errors.length > 0) {
              message += '\n\n错误信息：\n' + data.errors.join('\n');
            }
          }
          alert(message);
          closeModal();
          
          // 重新加载列表
          if (type === 'suppliers') {
            loadSupplierList();
          } else if (type === 'products') {
            loadProductList();
          } else if (type === 'customers') {
            loadCustomerList();
          } else if (type === 'inventory') {
            loadInventoryList();
          }
        } else {
          alert('导入失败：' + data.error);
        }
      } catch (error) {
        alert('导入失败：' + error.message);
      }
    }

        document.body.insertAdjacentHTML('beforeend', modalHTML);
        
        // 填充现有产品
        if (pi.products) {
          let piProducts = typeof pi.products === 'string' ? JSON.parse(pi.products) : pi.products;
          piProducts.forEach((product, index) => {
            addEditPIProductRow(product, index);
          });
        }
      } catch (error) {
        alert('加载失败：' + error.message);
      }
    }
    
    function addEditPIProductRow(existingProduct = null, index = null) {
      const container = document.getElementById('edit-pi-product-list');
      const rowIndex = index !== null ? index : container.children.length;
      
      const products = JSON.parse(container.dataset.products || '[]');
      let productsHTML = '<option value="">请选择产品</option>';
      products.forEach(p => {
        const displayName = p.chineseName || p.englishName || p.id;
        const selected = existingProduct && (p.id === existingProduct.productId || p.id === existingProduct.id) ? ' selected' : '';
        productsHTML += '<option value="' + p.id + '"' + selected + ' data-chinese-name="' + (p.chineseName || '') + '" data-english-name="' + (p.englishName || '') + '">' + displayName + '</option>';
      });

      const productId = existingProduct ? (existingProduct.productId || existingProduct.id || '') : '';
      const quantity = existingProduct ? (existingProduct.quantity || 1) : 1;

      let rowHTML = '<div class="border-b border-gray-200 py-4" data-index="' + rowIndex + '"><div class="grid grid-cols-4 gap-4"><div><label class="block text-xs text-gray-500">产品名称</label><select class="pi-product-select w-full px-2 py-1 text-sm border border-gray-300 rounded" onchange="onEditPIProductSelect(this, ' + rowIndex + ')">' + productsHTML + '</select></div><div><label class="block text-xs text-gray-500">产品ID</label><input type="text" class="pi-product-id w-full px-2 py-1 text-sm border border-gray-300 rounded bg-gray-50" readonly value="' + productId + '"></div><div><label class="block text-xs text-gray-500">数量</label><input type="number" value="' + quantity + '" class="w-full px-2 py-1 text-sm border border-gray-300 rounded"></div><div><label class="block text-xs text-gray-500">操作</label><button onclick="removeEditPIProductRow(' + rowIndex + ')" class="text-red-600 hover:text-red-900">删除</button></div></div></div>';

      container.insertAdjacentHTML('beforeend', rowHTML);
    }
    
    function onEditPIProductSelect(selectElement, index) {
      const container = document.getElementById('edit-pi-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      const productIdInput = row.querySelector('.pi-product-id');
      
      const selectedOption = selectElement.options[selectElement.selectedIndex];
      if (selectedOption.value) {
        productIdInput.value = selectedOption.value;
      } else {
        productIdInput.value = '';
      }
    }
    
    function removeEditPIProductRow(index) {
      const container = document.getElementById('edit-pi-product-list');
      const row = container.querySelector('[data-index="' + index + '"]');
      if (row) {
        row.remove();
        // 更新剩余行的索引
        container.querySelectorAll('[data-index]').forEach((r, i) => {
          r.dataset.index = i;
        });
      }
    }
    
    async function saveEditPI() {
      const user = checkLogin();
      if (!user) return;

      const piId = document.getElementById('edit-pi-product-list').dataset.piId;
      const note = document.getElementById('edit-pi-note').value;

      const productRows = document.querySelectorAll('#edit-pi-product-list > div');
      const products = [];

      productRows.forEach(row => {
        const select = row.querySelector('.pi-product-select');
        const productIdInput = row.querySelector('.pi-product-id');
        const quantityInput = row.querySelector('input[type="number"]');
        
        const selectedOption = select.options[select.selectedIndex];
        const productName = selectedOption ? selectedOption.textContent : '';
        
        const product = {
          productId: productIdInput.value,
          productName: productName,
          quantity: parseInt(quantityInput.value) || 1
        };
        products.push(product);
      });

      // 验证
      if (products.length === 0) {
        alert('请至少添加一个产品');
        return;
      }

      try {
        const response = await fetch('/api/pi/' + piId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'username': user.username,
            'password': user.role === '业务员' ? 'sales123' : 'purchase123'
          },
          body: JSON.stringify({ products, note })
        });

        if (response.ok) {
          alert('更新成功');
          closeModal();
          loadPIList();
        } else {
          const data = await response.json();
          alert('更新失败：' + data.error);
        }
      } catch (error) {
        alert('更新失败：' + error.message);
      }
    }

    async function deletePI(id) {
      if (!confirm('确定要删除这个PI吗？')) return;
      const user = checkLogin();
      if (!user) return;
      try {
        const response = await fetch('/api/pi/' + id, {
          method: 'DELETE',
          headers: { 'username': user.username, 'password': user.role === '业务员' ? 'sales123' : 'purchase123' }
        });
        if (response.ok) {
          alert('删除成功');
          loadPIList();
        } else {
          const data = await response.json();
          alert('删除失败：' + data.error);
        }
      } catch (error) {
        alert('删除失败：' + error.message);
      }
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
      updateUserInfo();
      loadPurchaseOrderList();
    });
  </script>
</body>
</html>
